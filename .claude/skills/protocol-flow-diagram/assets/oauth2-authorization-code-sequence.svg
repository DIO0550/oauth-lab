<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 780">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowCyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f59e0b"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22c55e"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3b82f6"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a855f7"/>
    </marker>
    <!-- Open arrow for return -->
    <marker id="arrowOpenAmber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polyline points="0 0, 10 3.5, 0 7" fill="none" stroke="#f59e0b" stroke-width="1.2"/>
    </marker>
    <marker id="arrowOpenCyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polyline points="0 0, 10 3.5, 0 7" fill="none" stroke="#22d3ee" stroke-width="1.2"/>
    </marker>
    <marker id="arrowOpenGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polyline points="0 0, 10 3.5, 0 7" fill="none" stroke="#22c55e" stroke-width="1.2"/>
    </marker>
    <marker id="arrowOpenBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polyline points="0 0, 10 3.5, 0 7" fill="none" stroke="#3b82f6" stroke-width="1.2"/>
    </marker>
  </defs>

  <rect width="1100" height="780" fill="url(#bgGrad)"/>

  <!-- ==================== HEADER ==================== -->
  <text x="32" y="38" fill="#f8fafc" font-size="22" font-weight="700" font-family="'Segoe UI', sans-serif">OAuth 2.0 Authorization Code Flow</text>
  <text x="32" y="56" fill="#94a3b8" font-size="13" font-family="'Segoe UI', sans-serif">認可コードフロー — シーケンス図</text>
  <rect x="400" y="24" width="80" height="22" rx="11" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
  <text x="440" y="39" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="600" font-family="'Segoe UI', sans-serif">RFC 6749</text>
  <rect x="488" y="24" width="120" height="22" rx="11" fill="#1a2e05" stroke="#22c55e" stroke-width="1"/>
  <text x="548" y="39" text-anchor="middle" fill="#86efac" font-size="12" font-weight="600" font-family="'Segoe UI', sans-serif">authorization_code</text>

  <!-- ====================
    SEQUENCE DIAGRAM LAYOUT:
      4 actors across top, lifelines down
      Actor positions: x = 100, 310, 520, 730
      Lifeline Y: 170 to 700
      Messages at Y intervals
  ==================== -->

  <!-- Actor 1: ユーザー -->
  <g transform="translate(100, 108)" filter="url(#shadow)">
    <rect x="-48" y="-24" width="96" height="52" rx="10" fill="#1e1b2e" stroke="#a855f7" stroke-width="1.5"/>
    <text x="0" y="2" text-anchor="middle" fill="#d8b4fe" font-size="14" font-weight="700" font-family="'Segoe UI', sans-serif">ユーザー</text>
    <text x="0" y="16" text-anchor="middle" fill="#a855f7" font-size="12" opacity="0.7" font-family="'Segoe UI', sans-serif">User Agent</text>
  </g>

  <!-- Actor 2: クライアント -->
  <g transform="translate(310, 108)" filter="url(#shadow)">
    <rect x="-48" y="-24" width="96" height="52" rx="10" fill="#1e1b2e" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="0" y="2" text-anchor="middle" fill="#67e8f9" font-size="14" font-weight="700" font-family="'Segoe UI', sans-serif">クライアント</text>
    <text x="0" y="16" text-anchor="middle" fill="#22d3ee" font-size="12" opacity="0.7" font-family="'Segoe UI', sans-serif">Client App</text>
  </g>

  <!-- Actor 3: 認可サーバー -->
  <g transform="translate(520, 108)" filter="url(#shadow)">
    <rect x="-52" y="-24" width="104" height="52" rx="10" fill="#1e1b2e" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="0" y="2" text-anchor="middle" fill="#fcd34d" font-size="14" font-weight="700" font-family="'Segoe UI', sans-serif">認可サーバー</text>
    <text x="0" y="16" text-anchor="middle" fill="#f59e0b" font-size="12" opacity="0.7" font-family="'Segoe UI', sans-serif">Auth Server</text>
  </g>

  <!-- Actor 4: リソースサーバー -->
  <g transform="translate(730, 108)" filter="url(#shadow)">
    <rect x="-56" y="-24" width="112" height="52" rx="10" fill="#1e1b2e" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="0" y="2" text-anchor="middle" fill="#93c5fd" font-size="14" font-weight="700" font-family="'Segoe UI', sans-serif">リソースサーバー</text>
    <text x="0" y="16" text-anchor="middle" fill="#3b82f6" font-size="12" opacity="0.7" font-family="'Segoe UI', sans-serif">Resource Server</text>
  </g>

  <!-- ==================== LIFELINES ==================== -->
  <line x1="100" y1="140" x2="100" y2="710" stroke="#a855f7" stroke-width="1.2" stroke-dasharray="5,5" opacity="0.25"/>
  <line x1="310" y1="140" x2="310" y2="710" stroke="#22d3ee" stroke-width="1.2" stroke-dasharray="5,5" opacity="0.25"/>
  <line x1="520" y1="140" x2="520" y2="710" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="5,5" opacity="0.25"/>
  <line x1="730" y1="140" x2="730" y2="710" stroke="#3b82f6" stroke-width="1.2" stroke-dasharray="5,5" opacity="0.25"/>

  <!-- Activation bars -->
  <rect x="96" y="170" width="8" height="540" rx="2" fill="#a855f7" opacity="0.12"/>
  <rect x="306" y="170" width="8" height="540" rx="2" fill="#22d3ee" opacity="0.12"/>
  <rect x="516" y="200" width="8" height="400" rx="2" fill="#f59e0b" opacity="0.12"/>
  <rect x="726" y="610" width="8" height="80" rx="2" fill="#3b82f6" opacity="0.12"/>

  <!-- ==================== MESSAGES ==================== -->

  <!-- ① User → Client: ログインボタン押下 (Y=190) -->
  <path d="M 108 190 L 300 190" fill="none" stroke="#a855f7" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <circle cx="74" cy="190" r="13" fill="#a855f7"/>
  <text x="74" y="194" text-anchor="middle" fill="#fff" font-size="13" font-weight="700" font-family="'Segoe UI', sans-serif">1</text>
  <text x="204" y="183" text-anchor="middle" fill="#d8b4fe" font-size="12" font-weight="600" font-family="'Segoe UI', sans-serif">ログインボタン押下</text>

  <!-- ② Client → Auth Server: 認可リクエスト (Y=250) -->
  <path d="M 318 250 L 510 250" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="8,4" marker-end="url(#arrowAmber)" filter="url(#glow)"/>
  <circle cx="284" cy="250" r="13" fill="#22d3ee"/>
  <text x="284" y="254" text-anchor="middle" fill="#fff" font-size="13" font-weight="700" font-family="'Segoe UI', sans-serif">2</text>
  <text x="414" y="240" text-anchor="middle" fill="#67e8f9" font-size="12" font-weight="600" font-family="'Segoe UI', sans-serif">認可リクエスト (302 Redirect)</text>
  <!-- Params -->
  <rect x="332" y="257" width="196" height="30" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
  <text x="342" y="270" fill="#94a3b8" font-size="12" font-family="'Fira Code', monospace">response_type=<tspan fill="#22d3ee">code</tspan>&amp;client_id=xxx</text>
  <text x="342" y="282" fill="#94a3b8" font-size="12" font-family="'Fira Code', monospace">scope=openid&amp;state=abc&amp;redirect_uri=...</text>

  <!-- ③ Auth Server → User: 認証・同意画面 (Y=330) -->
  <path d="M 510 330 L 108 330" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowPurple)"/>
  <circle cx="546" cy="330" r="13" fill="#f59e0b"/>
  <text x="546" y="334" text-anchor="middle" fill="#fff" font-size="13" font-weight="700" font-family="'Segoe UI', sans-serif">3</text>
  <text x="310" y="322" text-anchor="middle" fill="#fcd34d" font-size="12" font-weight="600" font-family="'Segoe UI', sans-serif">認証・同意画面を表示</text>

  <!-- ④ User → Auth Server: 認証情報送信 (Y=390) -->
  <path d="M 108 390 L 510 390" fill="none" stroke="#a855f7" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <circle cx="74" cy="390" r="13" fill="#a855f7"/>
  <text x="74" y="394" text-anchor="middle" fill="#fff" font-size="13" font-weight="700" font-family="'Segoe UI', sans-serif">4</text>
  <text x="310" y="382" text-anchor="middle" fill="#d8b4fe" font-size="12" font-weight="600" font-family="'Segoe UI', sans-serif">ユーザー認証 + スコープに同意</text>

  <!-- ⑤ Auth Server → Client: 認可コード返却 (Y=450) -->
  <path d="M 510 450 L 318 450" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <circle cx="546" cy="450" r="13" fill="#f59e0b"/>
  <text x="546" y="454" text-anchor="middle" fill="#fff" font-size="13" font-weight="700" font-family="'Segoe UI', sans-serif">5</text>
  <text x="414" y="440" text-anchor="middle" fill="#fcd34d" font-size="12" font-weight="600" font-family="'Segoe UI', sans-serif">認可コード返却 (302 Redirect)</text>
  <rect x="344" y="457" width="164" height="18" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
  <text x="354" y="470" fill="#94a3b8" font-size="12" font-family="'Fira Code', monospace">code=<tspan fill="#f59e0b">SplxlOBe...</tspan>&amp;state=abc</text>

  <!-- ⑥ Client → Auth Server: トークンリクエスト (Y=520) — Back channel -->
  <path d="M 318 520 L 510 520" fill="none" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <circle cx="284" cy="520" r="13" fill="#22c55e"/>
  <text x="284" y="524" text-anchor="middle" fill="#fff" font-size="13" font-weight="700" font-family="'Segoe UI', sans-serif">6</text>
  <text x="414" y="510" text-anchor="middle" fill="#86efac" font-size="12" font-weight="600" font-family="'Segoe UI', sans-serif">トークンリクエスト (POST / バックチャネル)</text>
  <rect x="332" y="527" width="196" height="30" rx="4" fill="#0f172a" stroke="#22c55e" stroke-width="0.8"/>
  <text x="342" y="540" fill="#94a3b8" font-size="12" font-family="'Fira Code', monospace">grant_type=<tspan fill="#22c55e">authorization_code</tspan></text>
  <text x="342" y="552" fill="#94a3b8" font-size="12" font-family="'Fira Code', monospace">code=SplxlOBe...&amp;client_secret=...</text>

  <!-- ⑦ Auth Server → Client: トークン発行 (Y=590) -->
  <path d="M 510 590 L 318 590" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowOpenCyan)"/>
  <circle cx="546" cy="590" r="13" fill="#22c55e"/>
  <text x="546" y="594" text-anchor="middle" fill="#fff" font-size="13" font-weight="700" font-family="'Segoe UI', sans-serif">7</text>
  <text x="414" y="582" text-anchor="middle" fill="#86efac" font-size="12" font-weight="600" font-family="'Segoe UI', sans-serif">トークン発行</text>
  <rect x="344" y="597" width="164" height="18" rx="4" fill="#052e16" stroke="#22c55e" stroke-width="0.8"/>
  <text x="354" y="610" fill="#86efac" font-size="12" font-family="'Fira Code', monospace">access_token + refresh_token</text>

  <!-- ⑧ Client → Resource Server: APIリクエスト (Y=650) -->
  <path d="M 318 650 L 720 650" fill="none" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <circle cx="284" cy="650" r="13" fill="#3b82f6"/>
  <text x="284" y="654" text-anchor="middle" fill="#fff" font-size="13" font-weight="700" font-family="'Segoe UI', sans-serif">8</text>
  <text x="520" y="642" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="600" font-family="'Segoe UI', sans-serif">APIリクエスト (Bearer Token)</text>
  <rect x="390" y="657" width="220" height="18" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
  <text x="400" y="670" fill="#94a3b8" font-size="12" font-family="'Fira Code', monospace">Authorization: Bearer <tspan fill="#3b82f6">{access_token}</tspan></text>

  <!-- ⑨ Resource Server → Client: リソース返却 (Y=700) -->
  <path d="M 720 700 L 318 700" fill="none" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrowOpenCyan)"/>
  <circle cx="754" cy="700" r="13" fill="#3b82f6"/>
  <text x="754" y="704" text-anchor="middle" fill="#fff" font-size="13" font-weight="700" font-family="'Segoe UI', sans-serif">9</text>
  <text x="520" y="694" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="600" font-family="'Segoe UI', sans-serif">保護リソース返却 (200 OK)</text>

  <!-- ==================== PHASE LABELS (left side) ==================== -->
  <!-- Front channel phase -->
  <rect x="12" y="170" width="56" height="310" rx="6" fill="#22d3ee" opacity="0.04" stroke="#22d3ee" stroke-width="0.8" stroke-dasharray="4,4"/>
  <text x="40" y="330" text-anchor="middle" fill="#22d3ee" font-size="12" font-weight="600" font-family="'Segoe UI', sans-serif" transform="rotate(-90, 40, 330)" opacity="0.6">フロントチャネル</text>

  <!-- Back channel phase -->
  <rect x="12" y="500" width="56" height="130" rx="6" fill="#22c55e" opacity="0.04" stroke="#22c55e" stroke-width="0.8" stroke-dasharray="4,4"/>
  <text x="40" y="565" text-anchor="middle" fill="#22c55e" font-size="12" font-weight="600" font-family="'Segoe UI', sans-serif" transform="rotate(-90, 40, 565)" opacity="0.6">バックチャネル</text>

  <!-- API access phase -->
  <rect x="12" y="635" width="56" height="80" rx="6" fill="#3b82f6" opacity="0.04" stroke="#3b82f6" stroke-width="0.8" stroke-dasharray="4,4"/>
  <text x="40" y="675" text-anchor="middle" fill="#3b82f6" font-size="12" font-weight="600" font-family="'Segoe UI', sans-serif" transform="rotate(-90, 40, 675)" opacity="0.6">API</text>

  <!-- ==================== RIGHT SIDEBAR: Key Points ==================== -->
  <g transform="translate(830, 170)">
    <rect x="0" y="0" width="250" height="280" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="125" y="26" text-anchor="middle" fill="#e2e8f0" font-size="14" font-weight="700" font-family="'Segoe UI', sans-serif">セキュリティポイント</text>
    <line x1="14" y1="38" x2="236" y2="38" stroke="#334155" stroke-width="1"/>

    <!-- Point 1 -->
    <text x="16" y="60" fill="#f59e0b" font-size="13">🛡</text>
    <text x="36" y="60" fill="#f8fafc" font-size="12" font-weight="600" font-family="'Segoe UI', sans-serif">state パラメータ</text>
    <text x="36" y="74" fill="#94a3b8" font-size="12" font-family="'Segoe UI', sans-serif">CSRF攻撃を防ぐランダム値。リクエスト</text>
    <text x="36" y="86" fill="#94a3b8" font-size="12" font-family="'Segoe UI', sans-serif">とコールバックで一致を検証</text>

    <!-- Point 2 -->
    <text x="16" y="112" fill="#22c55e" font-size="13">🔒</text>
    <text x="36" y="112" fill="#f8fafc" font-size="12" font-weight="600" font-family="'Segoe UI', sans-serif">バックチャネル交換</text>
    <text x="36" y="126" fill="#94a3b8" font-size="12" font-family="'Segoe UI', sans-serif">トークン交換はサーバー間で実行し</text>
    <text x="36" y="138" fill="#94a3b8" font-size="12" font-family="'Segoe UI', sans-serif">ブラウザにトークンが露出しない</text>

    <!-- Point 3 -->
    <text x="16" y="164" fill="#22d3ee" font-size="13">⏱</text>
    <text x="36" y="164" fill="#f8fafc" font-size="12" font-weight="600" font-family="'Segoe UI', sans-serif">短寿命の認可コード</text>
    <text x="36" y="178" fill="#94a3b8" font-size="12" font-family="'Segoe UI', sans-serif">認可コードは一回限り使用可能で</text>
    <text x="36" y="190" fill="#94a3b8" font-size="12" font-family="'Segoe UI', sans-serif">通常10分以内に失効する</text>

    <!-- Point 4 -->
    <text x="16" y="216" fill="#a855f7" font-size="13">🔑</text>
    <text x="36" y="216" fill="#f8fafc" font-size="12" font-weight="600" font-family="'Segoe UI', sans-serif">client_secret 保護</text>
    <text x="36" y="230" fill="#94a3b8" font-size="12" font-family="'Segoe UI', sans-serif">クライアントシークレットはサーバー側</text>
    <text x="36" y="242" fill="#94a3b8" font-size="12" font-family="'Segoe UI', sans-serif">のみで保持、フロントに公開しない</text>

    <!-- Legend -->
    <line x1="14" y1="258" x2="236" y2="258" stroke="#334155" stroke-width="1"/>
    <line x1="16" y1="274" x2="36" y2="274" stroke="#22d3ee" stroke-width="2" stroke-dasharray="6,3"/>
    <text x="42" y="278" fill="#67e8f9" font-size="12" font-family="'Segoe UI', sans-serif">フロント</text>
    <line x1="90" y1="274" x2="110" y2="274" stroke="#22c55e" stroke-width="2"/>
    <text x="116" y="278" fill="#86efac" font-size="12" font-family="'Segoe UI', sans-serif">バック</text>
    <line x1="150" y1="274" x2="170" y2="274" stroke="#3b82f6" stroke-width="2"/>
    <text x="176" y="278" fill="#93c5fd" font-size="12" font-family="'Segoe UI', sans-serif">API</text>
    <line x1="200" y1="274" x2="220" y2="274" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="226" y="278" fill="#94a3b8" font-size="12" font-family="'Segoe UI', sans-serif">応答</text>
  </g>
</svg>
